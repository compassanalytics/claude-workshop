[project]
name = "compass-claude-101"
version = "0.1.0"
description = "Workshop demo project for Claude Code 101"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic[email]>=2.5",
  "sqlalchemy>=2.0",
  "loguru>=0.7",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
