// --- SECTION 1: Introduction (Julien) ---
sections[0].content = `# Spec-Driven Development

---

Last session we learned how to extend Claude Code — skills, hooks, subagents, plugins. Individual tools. This session: **how to compose them into workflows that actually hold together across sessions, phases, and context windows.**

The goal isn't automating away the developer. It's designing systems where AI and human reasoning reinforce each other — where every phase produces artifacts the next phase can use, and nothing important gets lost along the way.

---

## What Is Spec-Driven Development?

A structured approach to AI-assisted software development where **a specification drives every phase** — discovery, research, refinement, planning, implementation, and review. Each phase reads from prior artifacts and writes its own. The spec is the anchor that prevents intent drift across context windows.

This isn't unique to us. Several frameworks have converged on similar patterns:

| Framework | Approach |
|---|---|
| **GSD (Get Stuff Done)** | Task-driven workflow with structured handoffs between planning and execution phases |
| **Superpowers** | Opinionated multi-phase development with spec files as the source of truth |
| **Ralph / TDD** | Ticket-driven development — backlog tickets as specs, dependency-aware execution across isolated worktrees |

Different implementations, same core insight: **the spec is the contract between context windows.**

**[Image placeholder: Spec-driven development flow diagram — phases connected by artifacts]**

---

## Why Workflows, Not Just Prompting?

A single Claude session is powerful. But it has limits:

- **Context decay** — at 100k+ tokens, early instructions lose influence. Details from hour one get buried by hour three
- **Session boundaries** — close the terminal, lose the thread. "Continue where I left off" means the agent re-reads everything cold
- **Single perspective** — one context window doing research, planning, AND implementation mixes concerns and dilutes focus

Workflows solve this by **distributing reasoning across purpose-built phases.** Each phase has a narrow job, a clean context, and structured output the next phase consumes.

---

## Context Windows Over Time

This is the key mental model. Instead of one long session that decays, you get **multiple focused sessions that build on each other's artifacts:**

**[Image placeholder: Context windows over multiple sessions — showing how each session starts clean, reads prior artifacts, does focused work, writes output]**

Each context window starts fresh. It loads only what it needs — the spec, the previous phase's output, relevant decisions from \`knowledge.json\`. No accumulated noise. No telephone game through 200k tokens of conversation history.

---

## The Parallelization Advantage

Once work is decomposed into specs, **independent work streams can run simultaneously:**

**[Image placeholder: Parallel context windows — multiple sessions running concurrently on different tasks/features, each with their own spec anchoring them]**

- Research on feature A runs alongside implementation of feature B
- Multiple review agents each check a different aspect (security, performance, correctness)
- Parallel explorers investigate different parts of the codebase simultaneously

This is where the real leverage is. Not making one agent faster — **making multiple agents useful at the same time,** each in its own clean context, each anchored to a spec.

---

## What's Ahead

Richard will now walk through the **three design pillars** that make this work in practice:

1. **Persistence & State** — where artifacts live, how phases find each other
2. **Knowledge Flow** — what survives between phases and what gets lost
3. **Orchestration** — how the user drives the workflow and where humans stay in the loop

Then you'll build your own.`;


// --- SECTION 2: Designing Workflows (Richard) ---
sections[1].content = `# Designing Workflows That Work

---

**Without structure:** \u201CAdd OAuth to my app.\u201D Claude picks a library, guesses your architecture, forgets the compliance requirement from three messages ago. You spend thirty minutes correcting decisions that were never tracked.

**With structure:** Discovery captures the compliance requirement. Research finds your existing auth patterns. The plan respects both. Review catches drift.

The difference is whether knowledge survives between steps. Not every task justifies this \u2014 for quick fixes and small changes, just prompt and iterate. But when features span sessions, when rework is expensive, or when context needs to outlive a conversation, three design decisions determine whether the workflow holds:

**Persistence & state** \u2014 where artifacts live, how phases find each other\u2019s output, how you resume after closing a session.

**Knowledge flow** \u2014 what survives between phases. Decisions, assumptions, constraints, open questions \u2014 each will die at phase boundaries unless you design otherwise.

**Orchestration** \u2014 how the user invokes the workflow, where humans stay in the loop, how the system handles non-linear flow.

No right answers \u2014 just tradeoffs.`;


// --- SECTION 3: Persistence & State ---
sections[2].content = `# Persistence & State

---

What does a workflow actually look like on disk? Each phase produces an artifact. Those artifacts need to live somewhere every other phase can find, and persist when you close the session. Beyond the artifacts themselves, you need state tracking (where am I in the workflow?) and a way to manage knowledge transfer between phases \u2014 which we\u2019ll dig into in the next section.

---

## Directory Layout

A common approach is **per-feature directories** \u2014 each feature gets its own folder:

\`\`\`
.sdlc/features/
\u251C\u2500\u2500 auth-system/
\u2502   \u251C\u2500\u2500 discovery.md
\u2502   \u251C\u2500\u2500 research.md
\u2502   \u251C\u2500\u2500 plan.md
\u2502   \u251C\u2500\u2500 knowledge.json
\u2502   \u2514\u2500\u2500 state.json
\u2514\u2500\u2500 payment-flow/
    \u2514\u2500\u2500 discovery.md
\`\`\`

Multiple features in progress at once. Completed features stay as documentation. The agent needs to know which directory is active \u2014 passed as an argument, stored in a root-level state file, or derived from context.

**Every skill in your workflow must agree on the layout.** A shared conventions file that all skills read on startup is the simplest way \u2014 change the layout in one place, every skill follows.

---

## Artifact Formats

Each phase writes an artifact. The format determines what downstream phases can do with it. In practice you combine formats \u2014 prose for humans, structured data for agents, git for code history.

### Prose Artifacts

Markdown files that humans open in their editor. Natural format for specs, plans, and summaries.

\`\`\`markdown
# Discovery: Auth System

## Goals
- Replace custom JWT middleware with standards-compliant OAuth2
- Support PKCE flow for public clients (mobile, SPA)
- All PII must be encrypted at rest (legal/compliance requirement)

## Existing System
- Custom JWT middleware in \\\`src/lib/auth/middleware.ts\\\`
- Session tokens stored in Redis, 24h TTL
- 3 protected API routes, 12 public routes

## Open Questions
- Rate limiting strategy for token endpoint?
- Migration path for existing sessions?
\`\`\`

*Readable, not queryable.* \u201CWhat did we decide about auth?\u201D means reading the whole document.

### Structured Data

JSON or YAML files that track decisions, assumptions, and open questions as typed fields. Queryable by topic. Easy to diff between phases.

\`\`\`json
{
  "decisions": [
    { "topic": "auth", "decision": "OAuth2 + PKCE",
      "rationale": "compliance requirement",
      "phase": "discovery", "source": "user-requirement" }
  ],
  "assumptions": [
    { "assumption": "Postgres is the only datastore",
      "madeIn": "discovery", "status": "confirmed" }
  ],
  "openQuestions": [
    { "question": "Rate limiting strategy?",
      "raisedIn": "refinement", "blocksPhase": "implementation" }
  ]
}
\`\`\`

*Queryable, not readable.* Any phase can check \u201Cwhat\u2019s been decided about auth?\u201D without parsing pages of prose.

### Git Checkpoints

A commit or branch at each phase boundary. Full history, native rollback. *Versioned, but code-only* \u2014 captures file changes, not decisions, intent, or rationale.

### MCP Resources

MCP servers can also serve as artifact storage and retrieval backends. A local MCP server exposes artifacts as **resources** (read) and **tools** (write), letting phases access them through a standard protocol rather than direct file paths. The official MCP reference servers include a **Memory server** that stores entities and relations in a local knowledge graph \u2014 a real example of structured artifact storage via MCP.

---

## How Others Do It

These aren\u2019t theoretical patterns \u2014 real tools use them today:

| Tool | Persistence approach |
|---|---|
| **Devin** | Full persistent VM sandbox \u2014 filesystem, processes, and environment survive for the duration of a task |
| **GitHub Copilot Workspace** | Server-side persistence of spec \u2192 plan \u2192 code. Each step is editable before the next runs |
| **LangGraph** | Typed \`State\` object passed between nodes. Checkpointers (SQLite, Postgres) persist state across sessions |

The pattern: phased workflows need artifacts on disk (or in a database) and a state mechanism that survives session boundaries. The specific backend varies \u2014 filesystem, server-side storage, typed state with checkpointers \u2014 but the need is the same.

---

## State Tracking

Beyond artifacts, the workflow needs to know where it is: which phases are done, which is in progress, what comes next. This is also what enables resume, phase gating, and context loading \u2014 the state file tells each skill what\u2019s happened and what to read.

### Implicit

No state file. If \`plan.md\` exists, planning is done. Zero overhead, but you can\u2019t tell \u201Cin progress\u201D from \u201Ccomplete\u201D \u2014 a session crash mid-write leaves a partial artifact that looks finished. *Fragile.*

### Explicit State File

A JSON file every skill reads and updates:

\`\`\`json
{
  "feature": "auth-system",
  "mode": "existing-codebase",
  "currentPhase": "planning",
  "phases": {
    "discovery": { "status": "complete", "completedAt": "2026-04-10T10:30:00Z" },
    "research":  { "status": "complete", "completedAt": "2026-04-10T11:00:00Z" },
    "planning":  { "status": "in-progress", "startedAt": "2026-04-10T11:15:00Z" },
    "implement": { "status": "not-started" }
  }
}
\`\`\`

Resume (\u201Cyou left off mid-planning\u201D), phase gating (\u201Ccan\u2019t implement without a plan\u201D), status at a glance. *Reliable.* This is what LangGraph\u2019s checkpointers do under the hood.

### Embedded Metadata

Each artifact carries status in YAML frontmatter (\`status: complete\`, \`created: 2026-04-10\`). No single state file to corrupt, but getting a workflow overview means reading every artifact. Supplements the approaches above. *Supplementary.*

### MCP-Backed

A local MCP server (e.g., SQLite-backed) that skills query and update via tool calls. Transactional, queryable, survives crashed sessions. The MCP spec\u2019s experimental Tasks primitive provides built-in lifecycle states (\`working\`, \`completed\`, \`failed\`). More setup, but if you\u2019re already using MCP for artifact storage, extending it to state tracking is natural. *Robust, more setup.*

---

What happens when the knowledge inside these artifacts is wrong \u2014 or when the right knowledge never makes it in?`;

sections[3].content = `# How Knowledge Flows Between Phases

---

That\u2019s the question. Each phase doesn\u2019t just produce a document \u2014 it generates distinct types of knowledge, and each type has different consequences when it disappears.

---

## Types of Knowledge

| Type | Example | Why it matters |
|---|---|---|
| **Decisions** | \u201CUse OAuth2 + PKCE, no session tokens\u201D | Implementation must follow them. Review must verify they were followed |
| **Context** | \u201CExisting auth uses custom JWT middleware in \`src/lib/auth\`\u201D | Planning designs around it. Implementation knows where to put code |
| **Constraints** | \u201CCompliance requires all PII encrypted at rest\u201D | Non-negotiable \u2014 planning and implementation must respect them |
| **Assumptions** | \u201CAssuming Postgres is the only datastore\u201D | Must be validated before dependent phases, or they become bugs |
| **Open questions** | \u201CRate limiting strategy TBD\u201D | Must be resolved before the phase that depends on them. Untracked, they will be forgotten |
| **Rationale** | \u201CChose next-auth v5 for native PKCE support\u201D | Review checks whether the reasoning still holds, not just the choice |

Each type flows differently. Decisions made in discovery travel forward \u2014 implementation follows them, review checks them. Assumptions made implicitly in any phase travel sideways \u2014 they must be validated in research or refinement before they reach implementation. Open questions block forward progress \u2014 if untracked, the phase that needed the answer guesses instead.

> The agent doesn\u2019t lose knowledge because it\u2019s dumb \u2014 it loses knowledge because nobody designed a way to keep it.

This is why prose alone isn\u2019t enough. Decisions get buried in paragraphs. Assumptions stay implicit. Open questions get mentioned once and are forgotten 50,000 tokens later. You need a structured layer alongside your prose artifacts \u2014 something every phase can query:

\`\`\`json
// knowledge.json \u2014 grows across phases
{
  "decisions": [
    { "phase": "discovery", "topic": "auth",
      "decision": "OAuth2 + PKCE, no session tokens",
      "rationale": "compliance requirement from legal",
      "source": "user-requirement" }
  ],
  "assumptions": [
    { "assumption": "Postgres is the only datastore",
      "madeIn": "discovery", "status": "confirmed",
      "confirmedIn": "research" }
  ],
  "openQuestions": [
    { "question": "Rate limiting strategy?",
      "raisedIn": "refinement", "status": "unresolved",
      "blocksPhase": "implementation" }
  ]
}
\`\`\`

Notice the \`source\` field on decisions. Tracking where knowledge came from \u2014 user requirement, research finding, or agent recommendation the user confirmed \u2014 matters downstream. A user requirement carries more weight than an agent suggestion. When plans change, you need to know what\u2019s load-bearing and what\u2019s negotiable. This is **provenance**, and it\u2019s the difference between confidently changing a decision and accidentally overriding a compliance requirement.

---

## What Goes Wrong in Practice

The most common failure mode is **knowledge decay** \u2014 knowledge that was generated but wasn\u2019t structured to survive.

A discovery conversation reveals the user wants PostgreSQL. This gets mentioned in passing in the discovery summary. Research doesn\u2019t surface it as a constraint. Planning doesn\u2019t check it. Implementation uses SQLite because the agent never saw a firm decision \u2014 just a mention buried in a paragraph.

Now consider what happens next. Implementation builds SQLite migrations, writes repository patterns around SQLite\u2019s type system, structures tests accordingly. Review checks the implementation against the plan \u2014 which also doesn\u2019t mention PostgreSQL \u2014 and passes it. Four phases built on a wrong foundation. This is **error propagation**: a single piece of lost knowledge compounds through every downstream phase, and the later you catch it, the more expensive the fix. If each step in a pipeline is 95% reliable, a ten-step pipeline is only about 60% reliable.

This is why refinement and review exist as explicit phases. Refinement catches knowledge decay *before* planning builds on it. Review catches implementation drift *after*. Without both, errors propagate silently.

---

## How Much Each Phase Reads

Even with well-structured artifacts, you\u2019re making a tradeoff every time a phase loads context. The agent\u2019s context window is finite \u2014 and it\u2019s not just about capacity. Research shows LLMs attend less to information in the middle of long contexts (Liu et al., \u201CLost in the Middle,\u201D Stanford 2023). What you load shapes what the agent pays attention to and what it silently ignores.

| Strategy | What the phase reads | Strength | Risk |
|---|---|---|---|
| **Minimal** | Only the previous phase\u2019s output | Focused, fast | **Intent drift** \u2014 original intent mutates through rounds of paraphrasing |
| **Cumulative** | Every artifact from every prior phase | Complete picture | **Attention dilution** \u2014 agent drowns in content, mid-context information gets ignored |
| **Spec-anchored** | Original spec + direct input from previous phase. Everything else on disk if needed | Aligned to user intent | Requires the skill to explicitly reference where extra context lives |

We recommend spec-anchored for most cases. The original spec keeps every phase aligned to what the user actually asked for, even after multiple rounds of research and refinement. Without that anchor, intent drifts. This aligns with Anthropic\u2019s guidance on building effective agents: keep a ground truth document that every step references.

But the real insight is that **different phases should use different strategies.** Research loads minimally \u2014 just the discovery summary, because it needs focus, not breadth. Planning loads more \u2014 spec plus research plus refinement, because it needs the full picture. Implementation is spec-anchored \u2014 plan plus original spec, so it doesn\u2019t drift from either. The right strategy depends on what the phase does, not a one-size-fits-all rule.

Cumulative loading on a complex feature can burn 100K+ tokens per phase \u2014 that\u2019s real cost and real latency. Choose deliberately.

---

## Putting It Together

Here\u2019s what the persistence + knowledge flow actually looks like in practice \u2014 three phases, concrete data, showing exactly what gets read, written, and carried forward:

<img src="assets/artifact-flow.png" alt="Persistence and Knowledge Flow in Practice" style="max-width: 100%; border-radius: 8px;" />

The pattern repeats for Plan, Implement, and Review. Each phase reads what it needs from knowledge.json, does its work, writes its artifact, and updates shared state. When something breaks \u2014 gaps found, drift detected \u2014 the loop-back updates the same files.`;

---

You know what\u2019s stored and how knowledge flows. Now: how does someone actually *use* this?

---

## How Phases Connect

Four patterns for wiring phases into a workflow:

### Single orchestrator

One command that manages the whole flow \u2014 reads state, figures out what\u2019s next, runs it.

\`\`\`
/my-sdlc          \u2192  reads state, runs next phase
/my-sdlc status   \u2192  shows progress and current phase
/my-sdlc resume   \u2192  picks up where you left off
\`\`\`

Most natural for end-to-end workflows. You\u2019d think this is simpler than managing separate commands \u2014 but the orchestrator must handle every edge case (skipping phases, re-runs, mode detection), which makes it the hardest pattern to build well.

### Manual per-phase

Each phase is its own command. The user calls them in whatever order makes sense.

\`\`\`
/discover \u2192 /research \u2192 /refine \u2192 /plan \u2192 /implement \u2192 /review
\`\`\`

Each skill checks its own prerequisites: \u201Cis there a discovery artifact? If not, run /discover first.\u201D More control, less hand-holding. The tradeoff: more cognitive load on the user, no central coordination.

### Hybrid

An orchestrator with escape hatches. Guided when you want it, direct access when you don\u2019t.

\`\`\`
/my-sdlc next     \u2192  follows the standard flow
/my-sdlc plan     \u2192  jumps straight to planning
/my-sdlc status   \u2192  shows where you are
\`\`\`

This is often the right balance. The orchestrator handles the happy path and resume logic. Direct phase access lets users skip, re-run, or jump to what they need. Coordination without rigidity.

### State machine

Phases are states. Transitions are conditional: \u201Cif research found blockers, route to refinement; if clean, skip to planning.\u201D The orchestrator evaluates conditions at each boundary and routes accordingly.

This is how LangGraph \u2014 the most widely adopted agent orchestration framework \u2014 models workflows. More powerful than a linear pipeline because it encodes decision logic into the flow itself, but requires defining transition conditions up front. Andrew Ng\u2019s taxonomy of agentic design patterns (2024) calls this the \u201Cplanning\u201D pattern \u2014 the agent decides its own next step based on state.

---

## Human Checkpoints

Some phases should pause for the user; others should run autonomously. The deciding factor is **cost of error** \u2014 phases where a wrong call cascades expensively should be interactive; phases where the downside is wasted tokens can run on their own.

| Phase | Pattern | Why this default |
|---|---|---|
| **Discovery** | Interactive \u2014 agent interviews the user | Wrong requirements cascade through every downstream phase |
| **Research** | Autonomous \u2014 agent investigates, presents findings | Worst case is wasted effort, not wrong decisions |
| **Refinement** | Checkpoint \u2014 \u201Chere\u2019s what changed, do you agree?\u201D | User must validate before planning builds on assumptions |
| **Planning** | Mixed \u2014 agent presents options, user chooses | Architectural decisions are hard to reverse in implementation |
| **Implementation** | Configurable \u2014 hands-off or pause per component | Depends on trust in the plan and team preference |
| **Review** | Report \u2014 agent presents findings, user acts on them | User decides what to fix, what to accept, what to defer |

Note what review can and can\u2019t catch. Review verifies implementation against the spec \u2014 it catches drift, missed requirements, quality issues. But it can\u2019t catch a bad spec. If discovery captured the wrong requirement, review will confirm the wrong thing was built correctly.

---

## Non-Linear Flow

Real workflows aren\u2019t pipelines \u2014 they loop.

- Refinement reveals research missed something \u2192 re-run research with a narrower scope
- Implementation hits a constraint the plan didn\u2019t anticipate \u2192 update the plan, or re-run planning
- Review finds the implementation doesn\u2019t match the spec \u2192 loop back to implementation or planning

**Who decides when to loop?** Three options, and most workflows use a mix:

- **Agent-driven**: the phase itself detects the problem and triggers a re-run. Works for clear signals (tests fail, linter errors). Breaks on judgment calls.
- **User-driven**: the phase surfaces findings and the user decides. Safer, but adds latency and interruption.
- **Criteria-based**: define conditions up front. \u201CIf research surfaces more than 3 unresolved blockers, route to refinement before planning.\u201D Deterministic, but you need to anticipate the conditions.

This means every phase needs **re-run safety** \u2014 it will be run more than once:

- Don\u2019t silently overwrite \u2014 you lose the previous version and can\u2019t compare what changed
- Acknowledge what was there, record what\u2019s different and why
- Append a changelog entry, or version the artifact

---

## Adapting to Context

Your phases should detect whether they\u2019re working with an existing codebase or starting fresh, and adapt. Discovery scans the project first for existing code and asks informed questions; for greenfield, it goes deeper on stack and architecture decisions. Research explores existing patterns vs. researching best practices. A simple heuristic \u2014 check file count, look for package.json, see if there\u2019s meaningful code \u2014 works in practice. Store the result in state so every phase knows the mode.

---

## Where Session 1 Concepts Fit

Everything from last session has a role here:

| Concept | Role in the workflow |
|---|---|
| **Skills** | Each phase becomes a SKILL.md with instructions for what the agent does, reads, and writes. The orchestrator is also a skill |
| **Subagents** | Research spawns parallel investigators (security, patterns, libraries) each in clean context. Review benefits from a fresh-context agent that sees only the spec and code |
| **Hooks** | Deterministic guardrails. PreToolUse blocks file writes without a plan. PostToolUse runs the linter after edits. Stop reminds the agent to update state |
| **Plugins** | The finished package \u2014 phase skills, agents, hooks, and plugin.json bundled into a shareable directory |

---

## Now You Build Yours

Invoke \`/sdlc-coach\` \u2014 it walks you through designing every decision we just covered. Persistence, state, knowledge flow, orchestration, phase logic. Your answers shape your plugin.

There is no single right architecture. Type \`hint\` if you get stuck. \`/sdlc-coach resume\` to pick up where you left off.

> Go build something.`;

---

Once you have a working spec-driven workflow, there are deeper patterns worth exploring.

---

## MCPs as Interaction Protocols

MCP servers aren't just API wrappers — they can serve as **structured protocols between phases and agents.**

Instead of passing context through files alone, an MCP server can:

- **Expose workflow state as resources** — agents query the current phase, decisions, and open questions through a protocol rather than parsing files
- **Enforce transitions** — the MCP server validates that prerequisites are met before allowing a phase to start, rather than relying on each skill to check independently
- **Coordinate parallel agents** — a shared MCP server acts as the message bus between concurrent workers, tracking who's doing what and merging results

The shift: from "files on disk that agents read" to **"a live protocol that agents interact with."** The spec still lives on disk. But the workflow engine becomes a service rather than a set of conventions.

---

## Memory as a Managed Lifecycle

In a basic workflow, knowledge lives in artifacts — \`knowledge.json\`, prose files, state files. But knowledge has a lifecycle:

**Discovery** — new facts, assumptions, and constraints are surfaced

**Accumulation** — knowledge grows across phases. Decisions compound. The knowledge base gets richer

**Decay** — some knowledge becomes stale. An assumption made in discovery gets invalidated by research. A constraint changes

**Consolidation** — after a feature ships, the important learnings get extracted and the ephemeral details get archived

A managed memory lifecycle makes this explicit:

- **Knowledge graphs** that track relationships between decisions, not just flat lists
- **Staleness detection** — flag assumptions that haven't been validated in N phases
- **Cross-feature learning** — patterns from completed features inform new ones. "Last time we touched auth, we missed rate limiting. Flag it early this time"
- **Automated harvesting** — when a feature completes, extract the reusable learnings into a persistent knowledge base

The goal: **knowledge that gets smarter over time,** not just bigger.

---

## Where to Go From Here

These patterns aren't theoretical — they're how tools like TDD (Ticket-Driven Development) work in practice. Specs as tickets, knowledge graphs tracking cross-ticket themes, parallel execution across isolated worktrees, MCP servers coordinating the engine.

Start simple. Build the basic workflow with the \`/sdlc-coach\`. Then evolve toward these patterns as your needs grow.`;

let currentSection = 0;

function buildNav() {
  const list = document.getElementById('nav-list');
  list.innerHTML = sections.map((s, i) => `
    <li>
      <a class="nav-item${i === currentSection ? ' active' : ''}" href="#${s.id}" onclick="goToSection(${i}); return false;" data-index="${i}">
        <span class="nav-number">${s.number}</span>
        <span class="nav-info">
          <span class="nav-title">${s.title}</span>
          <span class="nav-meta">
            ${s.duration ? `<span class="nav-duration">${s.duration}</span>` : ''}
            <span class="nav-author ${s.author}">${s.author === 'julien' ? 'Julien' : 'Richard'}</span>
          </span>
        </span>
      </a>
    </li>
  `).join('');
}

function renderSection(index) {
  const section = sections[index];
  let html = marked.parse(section.content);
  html = html.replace(/<p><strong>\[Image placeholder:\s*(.*?)\]<\/strong><\/p>/g, (match, desc) => {
    return `<div class="image-placeholder"><div class="placeholder-icon">&#128444;</div><div class="placeholder-text">${desc}</div></div>`;
  });
  document.getElementById('content').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToSection(index) {
  if (index < 0 || index >= sections.length) return;
  currentSection = index;
  renderSection(index);
  updateNav();
  updateProgress();
  history.replaceState(null, '', '#' + sections[index].id);
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }
}

function updateNav() {
  const items = document.querySelectorAll('.nav-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === currentSection);
  });
}

function updateProgress() {
  const pct = ((currentSection + 1) / sections.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    goToSection(currentSection + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goToSection(currentSection - 1);
  }
});

marked.setOptions({ breaks: false, gfm: true });

function init() {
  buildNav();
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    const idx = sections.findIndex(s => s.id === hash);
    if (idx >= 0) currentSection = idx;
  }
  renderSection(currentSection);
  updateNav();
  updateProgress();
}

init();
</script>
