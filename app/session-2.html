// --- SECTION 1: Introduction (Julien) ---
sections[0].content = `# Spec-Driven Development

---

> **Bring Claude with you** — Paste this into any Claude Code session to follow along interactively:
>
> \`\`\`
> Follow the Claude Code Workshop Session 2 companion guide and help me participate actively:
> https://raw.githubusercontent.com/compassanalytics/claude-workshop/main/workshop-session-2/COMPANION.md
> \`\`\`
>
> Claude will answer questions, surface key concepts as they come up, and guide you through the hands-on parts.

Last session we learned how to extend Claude Code — skills, hooks, subagents, plugins. Individual tools. This session: **how to compose them into workflows that actually hold together across sessions, phases, and context windows.**

The goal isn't automating away the developer. It's designing systems where AI and human reasoning reinforce each other — where every phase produces artifacts the next phase can use, and nothing important gets lost along the way.

---

## What Is Spec-Driven Development?

A structured approach to AI-assisted software development where **a specification drives every phase** — discovery, research, refinement, planning, implementation, and review. Each phase reads from prior artifacts and writes its own. The spec is the contract between context windows.

![Spec Driven Development — Stage 1: Creating the Spec, Stage 2: Implementing the Spec](images/spec-driven-tutorial.png)

This isn't unique to us. Several frameworks have converged on similar patterns:

| Framework | Approach |
|---|---|
| **GSD (Get Stuff Done)** | Task-driven workflow with structured handoffs between planning and execution phases |
| **Superpowers** | Opinionated multi-phase development with spec files as the source of truth |
| **Ralph / TDD** | Ticket-driven development — backlog tickets as specs, dependency-aware execution across isolated worktrees |
| **GitHub Spec Kit** | Open-source toolkit with explicit phases: Specify → Clarify → Plan → Tasks → Implement. Uses \`spec.md\` and a project \`constitution\` as living artifacts |
| **AWS Kiro** | IDE-native agentic environment built around three documents: \`requirements.md\` (EARS notation), \`design.md\`, and \`tasks.md\`. Emphasizes structured requirements over "vibe coding" |
| **OpenSpec** | CLI-driven artifact chain: \`proposal.md\` → \`design.md\` → \`specs/*.md\` → \`tasks.md\` → implementation → archive. Features delta specs that sync back to a central knowledge base |
| **Liatrio SDD Prompts** | Lightweight, repo-native workflow expressed as Markdown prompts: Spec → Tasks → Implement → Validate. No new IDE required — installs as slash commands in existing tools |
| **Aider (Architect Mode)** | Terminal pair programmer with a built-in two-model planning phase: an architect model proposes the solution, then an editor model translates it into specific file edits |

Different implementations, same core insight: **the spec is the contract between context windows.**

What varies is *where* the spec lives (a markdown file, a ticket, a prompt), *who writes it* (human, agent, or both), and *how strictly phases are enforced* (human gates, automated checks, or informal conventions).

![Spec-driven development flow — phases connected by artifacts](images/spec-driven-flow.png)

---

## The Externalization Arc

There's a deeper pattern behind why these workflows work. A recent systems-level review of LLM agents (Zhou et al., 2026) frames it through the lens of **externalization** — the progressive relocation of cognitive burdens from the model's internal weights into persistent, inspectable external structures.

The paper draws a direct parallel between human civilization and LLM agent evolution:

![Externalization of Human vs. LLM Agent — from thought to harness](images/externalization-human-llm.png)

Just as humans externalized thought into language, writing, printing, and computing, LLM agents are externalizing capability from weights into **memory** (state), **skills** (expertise), **protocols** (interaction), and the **harness** that coordinates them.

And this isn't just a theoretical framing — you can trace how community focus has shifted over time, from weights and fine-tuning toward context engineering, skills, and now full harness design:

![How community themes shift from 2022 to 2026 — Weights → Context → Skills → Harness](images/themes-timeline.png)

**Spec-driven development is a harness.** It doesn't make the model bigger or the prompts longer. It reorganizes the task so the model can solve it more reliably with the capabilities it already has.

---

## Why Workflows, Not Just Prompting?

A single Claude session is powerful. But it has limits:

- **Context decay** — at 100k+ tokens, early instructions lose influence. Details from hour one get buried by hour three
- **Session boundaries** — close the terminal, lose the thread. "Continue where I left off" means the agent re-reads everything cold
- **Single perspective** — one context window doing research, planning, AND implementation mixes concerns and dilutes focus

Workflows solve this by **distributing reasoning across purpose-built phases.** Each phase has a narrow job, a clean context, and structured output the next phase consumes.

---

## Context Windows Over Time

This is the key mental model. Instead of one long session that decays, you get **multiple focused sessions that build on each other's artifacts:**

![Context windows over multiple sessions — each starts clean, reads artifacts, does focused work, writes output](images/context-windows.png)

Each context window starts fresh. It loads only what it needs — the spec, the previous phase's output, relevant decisions from \`knowledge.json\`. No accumulated noise. No telephone game through 200k tokens of conversation history.

---

## The Parallelization Advantage

Once work is decomposed into specs, **independent work streams can run simultaneously:**

![Parallel context windows — multiple sessions running concurrently on different tasks/features, each anchored to a spec](images/parallel-contexts.png)

- Research on feature A runs alongside implementation of feature B
- Multiple review agents each check a different aspect (security, performance, correctness)
- Parallel explorers investigate different parts of the codebase simultaneously

This is where the real leverage is. Not making one agent faster — **making multiple agents useful at the same time,** each in its own clean context, each anchored to a spec.

---

## What's Ahead

Richard will now walk through the **three design pillars** that make this work in practice:

1. **Persistence & State** — where artifacts live, how phases find each other
2. **Knowledge Flow** — what survives between phases and what gets lost
3. **Orchestration** — how the user drives the workflow and where humans stay in the loop

Then you'll build your own.`;


// --- SECTION 2: Designing Workflows (Richard) ---
sections[1].content = `# Designing Workflows That Work

---

You\u2019ve seen what spec-driven development looks like and why single-session prompting breaks down. Now: **how do you actually design a workflow that holds together?**

It comes down to three decisions. Get these right and everything else follows. Get them wrong and you\u2019re debugging invisible failures across phases.

---

## Three Design Pillars

**1. Persistence & State**
- Where do artifacts live on disk?
- How does each phase find the previous phase\u2019s output?
- How do you resume after closing a session?

**2. Knowledge Flow**
- What types of knowledge do phases produce?
- Which of those survive between phases \u2014 and which silently die?
- How do you prevent decisions from getting lost in prose?

**3. Orchestration**
- How does the user invoke and navigate the workflow?
- Where do humans stay in the loop?
- What happens when the flow isn\u2019t linear?

No right answers \u2014 just tradeoffs. Let\u2019s walk through each.`;


// --- SECTION 3: Persistence & State ---
sections[2].content = `# Persistence & State

---

What does a workflow look like on disk?

- Each phase produces an **artifact**
- Artifacts need to live where every other phase can find them
- They need to **persist** when you close the session
- You need **state tracking** \u2014 where am I in the workflow?
- And a way to manage **knowledge transfer** between phases (next section)

---

## Directory Layout

**Per-feature directories** \u2014 each feature gets its own folder:

\`\`\`
.sdlc/features/
\u251C\u2500\u2500 auth-system/
\u2502   \u251C\u2500\u2500 discovery.md
\u2502   \u251C\u2500\u2500 research.md
\u2502   \u251C\u2500\u2500 plan.md
\u2502   \u251C\u2500\u2500 knowledge.json
\u2502   \u2514\u2500\u2500 state.json
\u2514\u2500\u2500 payment-flow/
    \u2514\u2500\u2500 discovery.md
\`\`\`

- Multiple features in progress at once
- Completed features stay as documentation
- Agent needs to know which directory is active \u2014 passed as argument, stored in state, or derived from context

**Key rule:** every skill must agree on the layout. A shared conventions file is the simplest way.

---

## Artifact Formats

The format determines what downstream phases can do with it. In practice, you combine them.

### Prose Artifacts

Markdown \u2014 readable by humans, natural for specs and plans.

\`\`\`markdown
# Discovery: Auth System

## Goals
- Replace custom JWT middleware with standards-compliant OAuth2
- Support PKCE flow for public clients (mobile, SPA)
- All PII must be encrypted at rest (legal/compliance requirement)

## Existing System
- Custom JWT middleware in \\\`src/lib/auth/middleware.ts\\\`
- Session tokens stored in Redis, 24h TTL
- 3 protected API routes, 12 public routes

## Open Questions
- Rate limiting strategy for token endpoint?
- Migration path for existing sessions?
\`\`\`

*Readable, not queryable.* \u201CWhat did we decide about auth?\u201D means reading the whole document.

### Structured Data

JSON/YAML \u2014 queryable by topic, easy to diff between phases.

\`\`\`json
{
  "decisions": [
    { "topic": "auth", "decision": "OAuth2 + PKCE",
      "rationale": "compliance requirement",
      "phase": "discovery", "source": "user-requirement" }
  ],
  "assumptions": [
    { "assumption": "Postgres is the only datastore",
      "madeIn": "discovery", "status": "confirmed" }
  ],
  "openQuestions": [
    { "question": "Rate limiting strategy?",
      "raisedIn": "refinement", "blocksPhase": "implementation" }
  ]
}
\`\`\`

*Queryable, not readable.* Any phase can check \u201Cwhat\u2019s been decided about auth?\u201D without parsing pages of prose.

### Git Checkpoints

A commit or branch at each phase boundary. Full history, native rollback. *Versioned, but code-only* \u2014 captures file changes, not decisions, intent, or rationale.

### MCP Resources

- MCP server exposes artifacts as **resources** (read) and **tools** (write)
- Phases access them through a standard protocol, not direct file paths
- **Why over files?** Multiple tools (Claude Code, Cursor, custom agents) can all read/write the same artifacts through one protocol instead of each needing to know your directory layout

---

## How Others Do It

| Tool | Persistence approach |
|---|---|
| **Devin** | Full persistent VM sandbox \u2014 filesystem, processes, and environment survive for the duration of a task |
| **GitHub Copilot Workspace** | Server-side persistence of spec \u2192 plan \u2192 code. Each step is editable before the next runs |
| **LangGraph** | Typed \`State\` object passed between nodes. Checkpointers (SQLite, Postgres) persist state across sessions |

**The pattern:** artifacts on disk (or in a database) + a state mechanism that survives session boundaries.

---

## State Tracking

The workflow needs to know: which phases are done, which is in progress, what comes next. This enables **resume**, **phase gating**, and **context loading**.

### Implicit

No state file. \`plan.md\` exists = planning is done. Zero overhead, but can\u2019t tell \u201Cin progress\u201D from \u201Ccomplete.\u201D *Fragile.*

### Explicit State File

JSON file every skill reads and updates:

\`\`\`json
{
  "feature": "auth-system",
  "mode": "existing-codebase",
  "currentPhase": "planning",
  "phases": {
    "discovery": { "status": "complete", "completedAt": "2026-04-10T10:30:00Z" },
    "research":  { "status": "complete", "completedAt": "2026-04-10T11:00:00Z" },
    "planning":  { "status": "in-progress", "startedAt": "2026-04-10T11:15:00Z" },
    "implement": { "status": "not-started" }
  }
}
\`\`\`

Resume, phase gating, status at a glance. *Reliable.* This is what LangGraph\u2019s checkpointers do under the hood.

### Embedded Metadata

YAML frontmatter in each artifact (\`status: complete\`, \`created: 2026-04-10\`). No single state file to corrupt, but getting a workflow overview means reading every artifact. *Supplementary.*

### MCP-Backed

Local MCP server (e.g., SQLite-backed) \u2014 skills query and update via tool calls. Transactional, queryable, survives crashes. Same benefit as above: one protocol, any tool can check workflow status. *Robust, more setup.*

---

What happens when the knowledge inside these artifacts is wrong \u2014 or when the right knowledge never makes it in?`;


// --- SECTION 4: Knowledge Flow ---
sections[3].content = `# How Knowledge Flows Between Phases

---

You have artifacts on disk and state tracking where you are. But none of that matters if the *content* inside those artifacts is wrong \u2014 or incomplete.

---

## Knowledge Decay

Without structure, knowledge disappears in three ways:

- **Assumptions pass as truth** \u2014 agent writes \u201Csingle currency\u201D in a paragraph. Decision or assumption? Later phases can\u2019t tell. Implementation hard-codes USD. Client needed EUR.
- **Open questions get forgotten** \u2014 you say \u201Crevisit the refund policy later.\u201D Agent doesn\u2019t track what\u2019s open. Three phases later, it picks no-refunds on its own.
- **Decisions get buried** \u2014 user says \u201Cuse Stripe.\u201D Mentioned once in discovery. Implementation picks Square from a tutorial. Review checks the plan, not the original requirement \u2014 **passes.**

Prose doesn\u2019t distinguish between types of knowledge. Everything looks like a statement. So what do you actually need to track?

---

## Types of Knowledge

| Type | Example | Why it matters |
|---|---|---|
| **Decisions** | \u201CUse Stripe for payments\u201D | Implementation must follow them. Review must verify they were followed |
| **Context** | \u201CExisting checkout flow is in \`src/components/Checkout.tsx\`\u201D | Planning designs around it. Implementation knows where to put code |
| **Constraints** | \u201CMust support refunds within 30 days \u2014 legal requirement\u201D | Non-negotiable \u2014 planning and implementation must respect them |
| **Assumptions** | \u201CAssuming single currency only\u201D | Must be validated before dependent phases, or they become bugs |
| **Open questions** | \u201CWhat\u2019s the refund policy?\u201D | Must be resolved before the phase that depends on it. Untracked, the agent just guesses |
| **Rationale** | \u201CChose Stripe over Square for webhook support\u201D | Review checks whether the reasoning still holds, not just the choice |

**How they flow:**
- **Decisions** travel forward \u2014 implementation follows them, review checks them
- **Assumptions** travel sideways \u2014 must be validated before dependent phases
- **Open questions** block progress \u2014 untracked, the agent just guesses

> The agent doesn\u2019t lose knowledge because it\u2019s dumb \u2014 it loses knowledge because nobody designed a way to keep it.

If \u201Cuse Stripe\u201D had been captured as a **decision** with \`source: "user-requirement"\`, no downstream phase could quietly switch to Square. Prose alone isn\u2019t enough. You need a **structured layer** every phase can query:

\`\`\`json
// knowledge.json \u2014 grows across phases
{
  "decisions": [
    { "phase": "discovery", "topic": "payments",
      "decision": "Use Stripe for payments",
      "rationale": "webhook support for async flows",
      "source": "user-requirement" }
  ],
  "assumptions": [
    { "assumption": "Single currency only",
      "madeIn": "discovery", "status": "confirmed",
      "confirmedIn": "research" }
  ],
  "openQuestions": [
    { "question": "What's the refund policy?",
      "raisedIn": "discovery", "status": "resolved",
      "resolvedIn": "refinement" }
  ]
}
\`\`\`

Notice the \`source\` field. This is **provenance** \u2014 where knowledge came from:
- **User requirement** \u2192 load-bearing, don\u2019t override without asking
- **Research finding** \u2192 evidence-based, but revisable
- **Agent suggestion** \u2192 negotiable, lowest weight

If implementation wants to swap Stripe for a cheaper provider, provenance tells it: this was a user requirement \u2014 **ask first.**

**Why refinement and review exist as explicit phases:**
- **Refinement** catches decay *before* planning builds on it
- **Review** catches drift *after* implementation

---

## How Much Each Phase Reads

Every phase load is a tradeoff. The context window is finite, and LLMs attend less to information in the middle of long contexts *(Liu et al., \u201CLost in the Middle,\u201D Stanford 2023)*.

| Strategy | What the phase reads | Strength | Risk |
|---|---|---|---|
| **Minimal** | Only the previous phase\u2019s output | Focused, fast | **Intent drift** \u2014 original intent mutates through rounds of paraphrasing |
| **Cumulative** | Every artifact from every prior phase | Complete picture | **Attention dilution** \u2014 agent drowns in content, mid-context information gets ignored |
| **Spec-anchored** | Original spec + direct input from previous phase. Everything else on disk if needed | Aligned to user intent | Requires the skill to explicitly reference where extra context lives |

**Spec-anchored works for most cases** \u2014 the original spec keeps every phase aligned to what the user actually asked for.

But **different phases should use different strategies:**
- **Research** \u2192 minimal \u2014 just the discovery summary, needs focus not breadth
- **Planning** \u2192 cumulative \u2014 spec + research + refinement, needs the full picture
- **Implementation** \u2192 spec-anchored \u2014 plan + original spec, so it drifts from neither

Cumulative loading on a complex feature can burn **100K+ tokens per phase** \u2014 real cost, real latency. Choose deliberately.

---

## Putting It Together

Persistence + knowledge flow in practice \u2014 three phases, concrete data:

<img src="assets/artifact-flow.png" alt="Persistence and Knowledge Flow in Practice" style="max-width: 100%; border-radius: 8px;" />

Same pattern continues through Plan \u2192 Implement \u2192 Review. Read from knowledge.json, do the work, write the artifact, update state. When something breaks, the loop-back updates the same files.`;


// --- SECTION 5: Orchestration ---
sections[4].content = `# Orchestration

---

You know what\u2019s stored and how knowledge flows. Now: how does someone actually *use* this?

---

## How Phases Connect

Four patterns for wiring phases into a workflow:

### Single orchestrator

One command that manages the whole flow \u2014 reads state, figures out what\u2019s next, runs it.

\`\`\`
/my-sdlc          \u2192  reads state, runs next phase
/my-sdlc status   \u2192  shows progress and current phase
/my-sdlc resume   \u2192  picks up where you left off
\`\`\`

Most natural UX, but the orchestrator must handle every edge case \u2014 hardest to build well. **Start here if** you want a polished end-user experience and are willing to invest in edge-case handling.

### Manual per-phase

Each phase is its own command. The user calls them in whatever order makes sense.

\`\`\`
/discover \u2192 /research \u2192 /refine \u2192 /plan \u2192 /implement \u2192 /review
\`\`\`

Each skill checks its own prerequisites. More control, but more cognitive load on the user. **Start here if** you\u2019re prototyping \u2014 build each phase as a standalone skill, wire them together later.

### Hybrid

An orchestrator with escape hatches. Guided when you want it, direct access when you don\u2019t.

\`\`\`
/my-sdlc next     \u2192  follows the standard flow
/my-sdlc plan     \u2192  jumps straight to planning
/my-sdlc status   \u2192  shows where you are
\`\`\`

Often the right balance \u2014 coordination without rigidity. **Start here if** you\u2019ve built the individual phases and want to add a guided flow without losing direct access.

### State machine

Phases are states. Transitions are conditional: \u201Cif research found blockers \u2192 refinement; if clean \u2192 planning.\u201D

This is how **LangGraph** models workflows \u2014 decision logic encoded into the flow itself. Andrew Ng\u2019s agentic design patterns (2024) calls this the \u201Cplanning\u201D pattern: the agent decides its own next step based on state. **Start here if** your workflow has branching logic and you need transitions that aren\u2019t just \u201Cnext.\u201D

---

## Human Checkpoints

The deciding factor: **cost of error.**

| Phase | Pattern | Why this default |
|---|---|---|
| **Discovery** | Interactive \u2014 agent interviews the user | Wrong requirements cascade through every downstream phase |
| **Research** | Autonomous \u2014 agent investigates, presents findings | Worst case is wasted effort, not wrong decisions |
| **Refinement** | Checkpoint \u2014 \u201Chere\u2019s what changed, do you agree?\u201D | User must validate before planning builds on assumptions |
| **Planning** | Mixed \u2014 agent presents options, user chooses | Architectural decisions are hard to reverse in implementation |
| **Implementation** | Configurable \u2014 hands-off or pause per component | Depends on trust in the plan and team preference |
| **Review** | Report \u2014 agent presents findings, user acts on them | User decides what to fix, what to accept, what to defer |

**Review catches drift, not bad specs.** If discovery captured the wrong requirement, review will confirm the wrong thing was built correctly.

---

## Non-Linear Flow

Real workflows aren\u2019t pipelines \u2014 they loop.

<div class="svg-diagram">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 140" style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">

  </defs>

  <rect x="290" y="35" width="110" height="45" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="345" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">Refine</text>
  <rect x="430" y="35" width="110" height="45" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="485" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#be185d">Plan</text>
  <rect x="570" y="35" width="110" height="45" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="625" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Implement</text>
  <rect x="710" y="35" width="110" height="45" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="765" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Review</text>
  <line x1="122" y1="57" x2="146" y2="57" stroke="#d97757" stroke-width="2" marker-end="url(#af)"/>

  <line x1="682" y1="57" x2="706" y2="57" stroke="#d97757" stroke-width="2" marker-end="url(#af)"/>

  <path d="M 760 80 Q 760 128 690 128 Q 630 128 630 82" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ab)"/>

  <text x="555" y="121" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="600">plan doesn\u2019t hold</text>
  <text x="695" y="140" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="600">spec mismatch</text>
</svg>

- Refinement reveals research missed something \u2192 re-run research with a narrower scope
- Implementation hits a constraint the plan didn\u2019t anticipate \u2192 update the plan, or re-run planning
- Review finds the implementation doesn\u2019t match the spec \u2192 loop back to implementation or planning

**Who decides when to loop?** Three options, and most workflows use a mix:

- **Agent-driven**: the phase itself detects the problem and triggers a re-run. Works for clear signals (tests fail, linter errors). Breaks on judgment calls.
- **User-driven**: the phase surfaces findings and the user decides. Safer, but adds latency and interruption.
- **Criteria-based**: define conditions up front. \u201CIf research surfaces more than 3 unresolved blockers, route to refinement before planning.\u201D Deterministic, but you need to anticipate the conditions.

This means every phase needs **re-run safety** \u2014 it will be run more than once:

- Don\u2019t silently overwrite \u2014 you lose the previous version and can\u2019t compare what changed
- Acknowledge what was there, record what\u2019s different and why
- Append a changelog entry, or version the artifact

---

## Adapting to Context

Phases should detect **existing codebase vs. greenfield** and adapt:
- **Existing**: discovery scans for code first, asks informed questions; research explores existing patterns
- **Greenfield**: discovery goes deeper on stack/architecture; research focuses on best practices
- **Detection**: simple heuristic \u2014 check file count, look for package.json, see if there\u2019s meaningful code
- Store the result in state so every phase knows the mode

---

## Where Session 1 Concepts Fit

Everything from last session has a role here:

| Concept | Role in the workflow |
|---|---|
| **Skills** | Each phase becomes a SKILL.md with instructions for what the agent does, reads, and writes. The orchestrator is also a skill |
| **Subagents** | Research spawns parallel investigators (security, patterns, libraries) each in clean context. Review benefits from a fresh-context agent that sees only the spec and code |
| **Hooks** | Deterministic guardrails. PreToolUse blocks file writes without a plan. PostToolUse runs the linter after edits. Stop reminds the agent to update state |
| **Plugins** | The finished package \u2014 phase skills, agents, hooks, and plugin.json bundled into a shareable directory |

---

## Now You Build Yours

Invoke \`/sdlc-coach\` \u2014 it walks you through designing every decision we just covered. Persistence, state, knowledge flow, orchestration, phase logic. Your answers shape your plugin.

There is no single right architecture. Type \`hint\` if you get stuck. \`/sdlc-coach resume\` to pick up where you left off.

> Go build something.`;

// --- SECTION 7: Advanced Topics (Julien) ---
sections[6].content = `# Advanced Topics

---

Once you have a working spec-driven workflow, there are deeper patterns worth exploring. These ideas come from the cutting edge of how agent systems are evolving — from ad-hoc prompting toward structured cognitive infrastructure.

---

## MCPs as Interaction Protocols

MCP servers aren't just API wrappers — they can serve as **structured protocols between phases and agents.**

Instead of passing context through files alone, an MCP server can:

- **Expose workflow state as resources** — agents query the current phase, decisions, and open questions through a protocol rather than parsing files
- **Enforce transitions** — the MCP server validates that prerequisites are met before allowing a phase to start, rather than relying on each skill to check independently
- **Coordinate parallel agents** — a shared MCP server acts as the message bus between concurrent workers, tracking who's doing what and merging results

The shift: from "files on disk that agents read" to **"a live protocol that agents interact with."** The spec still lives on disk. But the workflow engine becomes a service rather than a set of conventions.

![MCP server coordinating agents through structured protocols](images/mcp-protocols.png)

This maps directly to the **protocol externalization** dimension in agent systems: interaction structure (invocation grammar, lifecycle semantics, trust boundaries, discovery metadata) becomes explicit, inspectable, and reusable.

---

## Memory as a Managed Lifecycle

In a basic workflow, knowledge lives in artifacts — \`knowledge.json\`, prose files, state files. But real memory systems have far more structure than a flat file:

![Externalized State: Memory — from raw context through memory content, system architecture, to harness integration](images/memory-architecture.png)

And knowledge has a lifecycle:

![Memory lifecycle — discovery, accumulation, decay, consolidation](images/memory-lifecycle.png)

**Discovery** — new facts, assumptions, and constraints are surfaced

**Accumulation** — knowledge grows across phases. Decisions compound. The knowledge base gets richer

**Decay** — some knowledge becomes stale. An assumption made in discovery gets invalidated by research. A constraint changes

**Consolidation** — after a feature ships, the important learnings get extracted and the ephemeral details get archived

A managed memory lifecycle makes this explicit:

- **Knowledge graphs** that track relationships between decisions, not just flat lists
- **Staleness detection** — flag assumptions that haven't been validated in N phases
- **Cross-feature learning** — patterns from completed features inform new ones. "Last time we touched auth, we missed rate limiting. Flag it early this time"
- **Automated harvesting** — when a feature completes, extract the reusable learnings into a persistent knowledge base

This is **memory as externalized state** — not just "what the model remembers" but "what the system knows and how that knowledge evolves over time." The goal: **knowledge that gets smarter over time,** not just bigger.

---

## The Three Modules in Tension

Any sophisticated harness must manage the coupling between memory, skills, and protocols. They don't just coexist — they continuously reshape each other:

![Harness ecosystem — skills, memory, and protocols as interconnected clusters around the harness core](images/harness-ecosystem.png)

Each of these modules has deep internal structure. Let's zoom in:

![Module interactions — memory, skills, and protocols influencing each other](images/module-interactions.png)

- **Memory → Skills:** Execution records get distilled into reusable expertise
- **Skills → Memory:** Every skill run produces new state that must be recorded
- **Skills → Protocols:** New capabilities require new invocation contracts
- **Protocols → Skills:** Standardized interaction patterns enable new capability generation
- **Memory → Protocols:** Past strategy effectiveness shapes future interaction choices
- **Protocols → Memory:** Results from structured interactions feed back into the knowledge base

If your workflow feels like it's "fighting itself," the problem is usually here. A planning skill that doesn't write decisions in a format the implementation skill expects is a **protocol failure.** An implementation skill that doesn't record what it actually built is a **memory failure.** A review skill that can't invoke the right checks is a **skill boundary failure.**

Getting these three externalized dimensions to play well together is what separates a toy workflow from production-grade agent infrastructure.

To make this concrete, here's what a mature skills pipeline looks like — from how skills are acquired and composed, through selection and safety checks, to the runtime activation pipeline:

![Externalized Expertise: Skills — acquisition, artifact structure, selection heuristics, and activation pipeline](images/skills-architecture.png)

Skills aren't just "prompt snippets." They're structured artifacts with capabilities, preconditions, safety boundaries, and discovery metadata — orchestrated through a pipeline that mirrors how a harness turns static expertise into runtime behavior.

---

## Tmux-Based Multi-Agent Orchestration

When you need more than one agent working at the same time, **tmux has become the de-facto local control plane** for running multiple coding agents in parallel. It's lightweight, observable, and doesn't require custom servers or complex IPC.

The basic pattern is simple: spawn a coding agent in a detached tmux window, send it a prompt via \`tmux send-keys\`, and capture its output via \`tmux capture-pane\`. But the real power comes from orchestrating many of these sessions together:

- **Fan-out / fan-in:** Launch 5 parallel research agents, each investigating a different concern (security, performance, patterns, libraries, tests), then merge their findings
- **Sequential chains:** Run phase A in one window, wait for its sentinel file to appear, then spawn phase B
- **Batch-sequential waves:** Run groups of independent tasks in parallel, but sequence the groups (e.g., all explorers first, then all planners, then all implementors)

Several tools have emerged around this pattern:

| Tool | What it does |
|---|---|
| **swarmux** | Multi-agent Claude Code via tmux with N-pane layouts and pipeline patterns |
| **codex-orchestrator** | Delegates tasks to OpenAI Codex agents in detached tmux sessions with JSON status monitoring |
| **NTM** | Named Tmux Manager — a Go CLI that treats tmux as a "multi-agent command center" with agent mail and file reservations |
| **TDD Spawner** | Spawns \`tdd-workflow\` tackle-ticket sessions in tmux windows across runtimes (Claude, Kimi, Codex, Gemini) |

In the OhMyOpenCode ecosystem, the \`tdd-spawner\` skill provides MCP tools like \`spawn_ticket_sessions\` that handle the tmux bookkeeping for you. You pass a list of tickets and a mode (\`parallel\`, \`sequential\`, or \`batch_sequential\`), and it creates the windows, respects \`TDD_MAX_WORKERS\`, and queues extras automatically.

The key insight: **tmux gives you process isolation + human observability for free.** You can watch the agents work in real time, jump into any session if it gets stuck, and kill the whole fleet with a single command.

---

## Sentinel Watchers

When you have agents running in detached tmux sessions, you need a way to know when they're done. **Sentinels are lightweight file-based signals** that replace polling with event-driven coordination.

The pattern works like this:

1. The orchestrator spawns an agent in a tmux window and gives it a session ID
2. The agent does its work
3. When finished, the agent calls \`signal_done.sh <session_id> [exit_code] [reason]\`
4. This creates a sentinel file — \`.tdd/engine/sentinels/<session_id>.done\` (or \`.error\`)
5. The orchestrator waits on these files (or uses \`tmux wait-for\`) and advances to the next step

Sentinels aren't just for success/failure. They can also act as circuit breakers:

- **Pause sentinel:** A file like \`ralph-pause.sentinel\` can halt an autonomous loop gracefully until a human removes it
- **Progress guards:** External watchdogs can detect if an agent hasn't written a new sentinel in N minutes and intervene
- **Error sentinels:** A \`.error\` file with a reason string lets the orchestrator decide whether to retry, escalate, or stop the chain

This is **protocol externalization at the execution layer** — the contract isn't just "what the agent should do," it's "how the agent signals that it's done."

---

## Ralph-Style Autonomous Loops

The final escalation of spec-driven development is **autonomy** — a loop that keeps running until the job is done, with fresh context on every iteration.

**Ralph** is the canonical pattern for this. Named after the simple bash loop \`while ! done; do ai_agent "$PROMPT"; done\`, it embodies a core philosophy: **state should live in the filesystem and git history, not in the agent's conversation memory.**

Here's how a Ralph-style loop works in practice:

1. **Read the spec** (e.g., \`prd.json\`, a ticket, or a backlog item)
2. **Pick the highest-priority uncompleted task**
3. **Spawn a fresh agent with that task and only the relevant context**
4. **The agent implements, runs checks, commits on green**
5. **Update the spec to reflect completion** (or append learnings to \`progress.txt\`)
6. **Loop back to step 1**

In the OhMyOpenCode TDD toolkit, \`/ralph\` takes this further:

- It computes **dependency waves** across the backlog (tickets that can run in parallel vs. tickets blocked by others)
- It spawns parallel tackle-ticket sessions via tmux for each wave
- It waits for all sentinels, checks for errors, cleans up completed sessions
- If new tickets become unblocked, it recomputes waves and continues
- A **circuit breaker** halts the loop after 3 consecutive failures
- A **pause sentinel** lets humans stop the loop gracefully

The result is a **self-driving harness** that turns your backlog into executed code, wave by wave, with human oversight available but not required for every step.

This is the frontier: not a bigger model, not a better prompt, but a **loop that externalizes intent, execution, and state so completely that the agent only needs to recognize what to do next.**

---

## Where to Go From Here

These patterns aren't theoretical — they're how tools like TDD (Ticket-Driven Development) work in practice. Here's what it looks like end-to-end — a PM session creating tickets as specs, and a DEV session consuming them through phased implementation:

![Example of Ticket Driven Development — PM session creates tickets, specs act as contracts, DEV session implements through phases](images/tdd-example.png)

Specs as tickets, knowledge graphs tracking cross-ticket themes, parallel execution across isolated worktrees, MCP servers coordinating the engine, tmux sessions running agent swarms, sentinels signaling completion, and Ralph loops grinding through waves autonomously.

The frontier is moving fast. The latest research points toward:

- **Self-evolving harnesses** — workflows that modify their own orchestration logic based on what works
- **Planning and goal management** as externalized artifacts, not just transient reasoning
- **Evaluation and verification** as runtime infrastructure, not post-hoc benchmarks
- **Multi-modal externalization** — diagrams, schemas, and visual artifacts as first-class spec citizens

Start simple. Build the basic workflow with the \`/sdlc-coach\`. Then evolve toward these patterns as your needs grow. The best harness is the one you actually use.`;

let currentSection = 0;

function buildNav() {
  const list = document.getElementById('nav-list');
  list.innerHTML = sections.map((s, i) => `
    <li>
      <a class="nav-item${i === currentSection ? ' active' : ''}" href="#${s.id}" onclick="goToSection(${i}); return false;" data-index="${i}">
        <span class="nav-number">${s.number}</span>
        <span class="nav-info">
          <span class="nav-title">${s.title}</span>
          <span class="nav-meta">
            ${s.duration ? `<span class="nav-duration">${s.duration}</span>` : ''}
            <span class="nav-author ${s.author}">${s.author === 'julien' ? 'Julien' : 'Richard'}</span>
          </span>
        </span>
      </a>
    </li>
  `).join('');
}

function renderSection(index) {
  const section = sections[index];
  let html = marked.parse(section.content);
  html = html.replace(/<p><strong>\[Image placeholder:\s*(.*?)\]<\/strong><\/p>/g, (match, desc) => {
    return `<div class="image-placeholder"><div class="placeholder-icon">&#128444;</div><div class="placeholder-text">${desc}</div></div>`;
  });
  document.getElementById('content').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToSection(index) {
  if (index < 0 || index >= sections.length) return;
  currentSection = index;
  renderSection(index);
  updateNav();
  updateProgress();
  history.replaceState(null, '', '#' + sections[index].id);
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }
}

function updateNav() {
  const items = document.querySelectorAll('.nav-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === currentSection);
  });
}

function updateProgress() {
  const pct = ((currentSection + 1) / sections.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    goToSection(currentSection + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goToSection(currentSection - 1);
  }
});

marked.setOptions({ breaks: false, gfm: true });

function init() {
  buildNav();
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    const idx = sections.findIndex(s => s.id === hash);
    if (idx >= 0) currentSection = idx;
  }
  renderSection(currentSection);
  updateNav();
  updateProgress();
}

init();
</script>
