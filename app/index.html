<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Workshop</title>
<style>
  :root {
    --bg: #fafaf8;
    --sidebar-bg: #1a1a2e;
    --accent: #d97757;
    --accent-light: #f0c4b0;
    --text: #2d2d2d;
    --text-muted: #6b6b7b;
    --border: #e0ddd8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    max-width: 640px;
    width: 100%;
    padding: 60px 32px;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 48px;
  }

  .sessions {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .session-card {
    display: block;
    padding: 28px 28px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .session-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(217, 119, 87, 0.1);
  }

  .session-card .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .session-card .title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .session-card .desc {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Claude Code Workshop</h1>
  <div class="subtitle">Compass Analytics</div>

  <div class="sessions">
    <a href="session-1.html" class="session-card">
      <div class="label">Session 1</div>
      <div class="title">From Basics to Power User</div>
      <div class="desc">CLAUDE.md, rules, skills, hooks, MCP, subagents, agent teams, plugins, permissions.</div>
    </a>

    <a href="session-2.html" class="session-card">
      <div class="label">Session 2</div>
      <div class="title">Agentic SDLC Workflows</div>
      <div class="desc">Spec-driven development, structured lifecycles, building your own SDLC plugin.</div>
    </a>
  </div>
</div>
</body>
</html>
